name: Build Script2Gif for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev,build]"

      - name: Test
        run: python -m pytest

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean packaging/script2gif.spec

      - name: Build installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: Script2Gif-windows-x64
          path: |
            dist/Script2Gif
            dist/installer/*.exe
          if-no-files-found: error
